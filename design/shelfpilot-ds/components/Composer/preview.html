<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>Composer</title></head>
<body>
<div class="sp-stack">
  <div class="sp-chips">
    <button class="sp-chip"><span class="sp-chip__bolt">⚡</span>ออกใหม่เดือนนี้</button>
    <button class="sp-chip"><span class="sp-chip__bolt">⚡</span>เล่มที่ฉันขาด</button>
  </div>
  <div>
    <div class="sp-composer">
      <textarea class="sp-composer__input" rows="1" placeholder="ถามเรื่องหนังสือ หรือพิมพ์ว่าเพิ่งซื้ออะไรมา…"></textarea>
      <button class="sp-composer__send" aria-label="ส่ง">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="sp-composer__hint">คำตอบอ้างอิงจากแค็ตตาล็อกและประกาศสำนักพิมพ์เท่านั้น</div>
  </div>
</div>
</body>
</html>
