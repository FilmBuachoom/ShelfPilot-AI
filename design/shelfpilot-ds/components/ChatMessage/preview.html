<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>ChatMessage</title></head>
<body>
<div class="sp-chat">
  <div class="sp-msg-user">มังงะหมอยาฯ เล่มล่าสุดออกหรือยัง ฉันขาดเล่มไหน?</div>
  <div class="sp-msg-ai">
    <div class="sp-msg-ai__mark" aria-hidden="true">✦</div>
    <div class="sp-msg-ai__body">
      <p>เล่มล่าสุดคือ <strong>เล่ม 13</strong> วางแผงแล้ว <button class="sp-cite"><span class="sp-cite__dot"></span>รักพิมพ์ · 12 พ.ย.</button></p>
      <p>คุณมีเล่ม 1–10 และ 12 จึงยังขาด <strong>เล่ม 11 และ 13</strong></p>
      <div class="sp-vols sp-vols--sm" style="margin-top:8px">
        <span class="sp-vol sp-vol--owned">1</span><span class="sp-vol sp-vol--owned">2</span><span class="sp-vol sp-vol--owned">3</span><span class="sp-vol sp-vol--owned">4</span><span class="sp-vol sp-vol--owned">5</span><span class="sp-vol sp-vol--owned">6</span><span class="sp-vol sp-vol--owned">7</span><span class="sp-vol sp-vol--owned">8</span><span class="sp-vol sp-vol--owned">9</span><span class="sp-vol sp-vol--owned">10</span><span class="sp-vol sp-vol--missing">11</span><span class="sp-vol sp-vol--owned">12</span><span class="sp-vol sp-vol--missing">13</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
