<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>CitationChip</title></head>
<body>
<div class="sp-stack">
  <div class="sp-stage" style="padding:0">
    <button class="sp-cite"><span class="sp-cite__dot"></span>รักพิมพ์ · 12 พ.ย.</button>
    <button class="sp-cite"><span class="sp-cite__dot"></span>X · รักพิมพ์ · 18 พ.ย.</button>
    <button class="sp-cite"><span class="sp-cite__dot"></span>แค็ตตาล็อก</button>
  </div>
  <div class="sp-source">
    <div class="sp-source__head"><span>Facebook · สนพ. รักพิมพ์</span><span class="sp-badge sp-badge--verified">✓ มีแหล่งอ้างอิง</span></div>
    <div class="sp-source__meta">โพสต์ 12 พ.ย. 2026 · src_0192</div>
    <pre class="sp-raw">พรีออเดอร์ "สืบคดีปริศนา หมอยาตำรับโคมแดง" นิยาย เล่ม 13 วางแผง 20 พ.ย.</pre>
    <div style="margin-top:8px"><button class="sp-btn sp-btn--sm">เปิดโพสต์ต้นฉบับ</button></div>
  </div>
</div>
</body>
</html>
