<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>ConfirmModal</title></head>
<body>
<div class="sp-modal-wrap">
  <div class="sp-modal" role="dialog" aria-labelledby="t">
    <h3 class="sp-modal__title" id="t">ตรวจให้แน่ใจก่อนไปร้าน</h3>
    <p class="sp-modal__sub">ร้านค้ามักมีหลายฉบับในชื่อเดียวกัน</p>
    <dl class="sp-confirm">
      <dt>เรื่อง</dt><dd>สืบคดีปริศนา หมอยาตำรับโคมแดง</dd>
      <dt>เล่ม</dt><dd>11</dd>
      <dt>ฉบับ</dt><dd><span class="sp-badge sp-badge--edition">มังงะ</span></dd>
    </dl>
    <div class="sp-modal__actions">
      <button class="sp-btn sp-btn--action sp-btn--block">ไปหน้าร้าน</button>
      <button class="sp-btn sp-btn--ghost sp-btn--block">ยกเลิก</button>
    </div>
    <p class="sp-modal__note">ShelfPilot ไม่ได้ขายหนังสือ ระบบจะเปิดหน้าร้านค้าภายนอก</p>
  </div>
</div>
</body>
</html>
