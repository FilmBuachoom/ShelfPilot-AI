<!-- @dsCard group="Shelf · Baseline" height=230 subtitle="home screen top" -->
<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>ShelfHeader</title></head>
<body>
<header class="sp-shelf-head" style="max-width:420px">
  <div class="sp-shelf-head__top">
    <h1 class="sp-shelf-head__title">คลังของฉัน</h1>
    <button class="sp-btn sp-btn--sm">+ เพิ่มเรื่อง</button>
  </div>
  <div class="sp-stats">
    <div class="sp-stat"><span class="sp-stat__num">42</span><span class="sp-stat__label">เรื่อง</span></div>
    <div class="sp-stat"><span class="sp-stat__num">318</span><span class="sp-stat__label">เล่ม</span></div>
    <div class="sp-stat sp-stat--missing"><span class="sp-stat__num">12</span><span class="sp-stat__label">ขาด</span></div>
    <div class="sp-stat sp-stat--upcoming"><span class="sp-stat__num">5</span><span class="sp-stat__label">ใกล้ออก</span></div>
  </div>
  <label class="sp-search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input placeholder="ค้นหาชื่อเรื่อง ไทย / อังกฤษ / ญี่ปุ่น">
  </label>
</header>
</body>
</html>
