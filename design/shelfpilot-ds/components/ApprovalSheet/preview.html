<!-- @dsCard group="AI · Safeguards (add-on)" height=470 subtitle="Approval Gate" -->
<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>ApprovalSheet</title></head>
<body>
<div class="sp-scrim">
  <div class="sp-sheet" role="dialog" aria-label="ยืนยันเพิ่มลงคลัง">
    <div class="sp-sheet__grip"></div>
    <h3 class="sp-sheet__title">เพิ่มลงคลัง 5 เล่ม?</h3>
    <p class="sp-sheet__sub">จากข้อความ "เพิ่งซื้อฟรีเรน เล่ม 9–12 กับสปายฯ เล่ม 14 มา"</p>
    <ul class="sp-items">
      <li class="sp-item">
        <div class="sp-item__thumb" style="background:var(--ink)"></div>
        <div class="sp-item__main">
          <div class="sp-item__title">คำอธิษฐานในวันที่จากลา Frieren</div>
          <div class="sp-item__meta"><span class="sp-badge sp-badge--edition">มังงะ</span><span>4 เล่ม</span></div>
        </div>
        <span class="sp-diff">+ 9–12</span>
      </li>
      <li class="sp-item">
        <div class="sp-item__thumb" style="background:var(--info-soft)"></div>
        <div class="sp-item__main">
          <div class="sp-item__title">SPY×FAMILY</div>
          <div class="sp-item__meta"><span class="sp-badge sp-badge--edition">มังงะ</span><span>1 เล่ม</span></div>
        </div>
        <span class="sp-diff">+ 14</span>
      </li>
    </ul>
    <div class="sp-sheet__actions">
      <button class="sp-btn">แก้ไข</button>
      <button class="sp-btn sp-btn--action" style="flex:1">ยืนยัน 5 เล่ม</button>
    </div>
  </div>
</div>
</body>
</html>
