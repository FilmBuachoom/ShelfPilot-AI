<!-- @dsCard group="Shelf · Baseline" height=270 subtitle="signature visual" -->
<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>VolumeStrip</title></head>
<body>
<div class="sp-stack">
  <div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><strong style="font-size:14px">คำอธิษฐานในวันที่จากลา Frieren</strong><span class="sp-badge sp-badge--edition">มังงะ</span></div>
    <div class="sp-vols">
      <span class="sp-vol sp-vol--owned">1</span><span class="sp-vol sp-vol--owned">2</span><span class="sp-vol sp-vol--owned">3</span><span class="sp-vol sp-vol--owned">4</span><span class="sp-vol sp-vol--owned">5</span><span class="sp-vol sp-vol--owned">6</span><span class="sp-vol sp-vol--owned">7</span><span class="sp-vol sp-vol--owned">8</span><span class="sp-vol sp-vol--missing">9</span><span class="sp-vol sp-vol--missing">10</span><span class="sp-vol sp-vol--owned">11</span><span class="sp-vol sp-vol--owned">12</span><span class="sp-vol sp-vol--owned">13</span><span class="sp-vol sp-vol--upcoming">14</span>
    </div>
  </div>
  <div class="sp-legend">
    <span><i style="background:var(--ink)"></i>มีแล้ว</span>
    <span><i style="border:1.5px dashed var(--ink-muted)"></i>ขาด</span>
    <span><i style="background:var(--accent-soft);border:1.5px solid var(--accent)"></i>กำลังออก</span>
  </div>
  <div class="sp-label" style="margin:0">แตะเพื่อติ๊ก (หน้ารายเรื่อง)</div>
  <div class="sp-vols sp-vols--lg">
    <button class="sp-vol sp-vol--owned" aria-pressed="true">1</button><button class="sp-vol sp-vol--owned" aria-pressed="true">2</button><button class="sp-vol sp-vol--missing" aria-pressed="false">3</button><button class="sp-vol sp-vol--owned" aria-pressed="true">4</button><button class="sp-vol sp-vol--upcoming" aria-pressed="false">5</button>
  </div>
  <div class="sp-vols sp-vols--sm">
    <span class="sp-vol sp-vol--owned">1</span><span class="sp-vol sp-vol--owned">2</span><span class="sp-vol sp-vol--owned">3</span><span class="sp-vol sp-vol--missing">4</span><span class="sp-vol sp-vol--upcoming">5</span>
  </div>
</div>
</body>
</html>
