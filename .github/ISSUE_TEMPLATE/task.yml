name: 🛠️ Task
description: Upgrade, refactor, configuration or docs
labels: ["maintenance"]
# projects: ["<org>/<project-number>"]   # e.g. ["ai-deta/3"] — auto-adds the issue to the project board
body:
  - type: input
    id: summary
    attributes:
      label: 📌 Short Summary
      placeholder: "One sentence — what needs to be done"
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 📋 To Do
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: ✅ Done When
      placeholder: "How we know it is finished"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 🚦 Priority
      options: [Urgent, High, Medium, Low]
      default: 2
