name: 🐞 Bug Report
description: Something is broken or not working as expected
labels: ["bug"]
# projects: ["<org>/<project-number>"]   # e.g. ["ai-deta/3"] — auto-adds the issue to the project board
body:
  - type: input
    id: summary
    attributes:
      label: 📌 Short Summary
      placeholder: "One sentence — what is broken and where"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to Reproduce
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 🎯 Expected vs Actual
      value: |
        **Expected:** 
        **Actual:** 
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 🌐 Environment
      options: [Production, Staging, Local]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 🚦 Priority
      options: [Urgent, High, Medium, Low]
      default: 2
  - type: textarea
    id: evidence
    attributes:
      label: 📸 Screenshots / Logs
