# Safety net for everyone: humans, Copilot, and Claude. Claude Code hooks
# (.claude/settings.json) only cover Claude; these run on every `git commit`.
#
# Setup once per machine:   pipx install pre-commit   (or: pip install pre-commit)
# Then once per clone:      pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbid-env-files
        name: Forbid committing .env files (commit .env.example instead)
        language: fail
        entry: "Do not commit .env files — commit .env.example instead:"
        files: '(^|/)\.env(\.[^/]*)?$'
        exclude: '\.(example|sample|template)$'

      - id: sync-copilot
        name: Regenerate Copilot instructions from CLAUDE.md and .claude/
        language: system
        entry: python3 .claude/scripts/sync_copilot.py
        pass_filenames: false
        files: '^(CLAUDE\.md|\.claude/(rules|agents)/)'
